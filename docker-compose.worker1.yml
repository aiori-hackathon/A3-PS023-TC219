services:
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: vm-worker:latest
    container_name: vm-worker-1
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - WORKER_ID=worker-1
      - WORKER_ADDR=0.0.0.0:8081
      - WORKER_TOKEN=${WORKER_TOKEN:-secret-worker-key}
      - DATA_DIR=/data
      - HOST_IP=${HOST_IP:-127.0.0.1}
      - TOTAL_MEMORY_MB=${TOTAL_MEMORY_MB:-14336}
      - HYPERVISOR_DRIVER=${HYPERVISOR_DRIVER:-auto}
      - CH_BIN=/usr/local/bin/cloud-hypervisor
    volumes:
      - /data:/data
      - /dev/kvm:/dev/kvm
      - /boot:/boot:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
